<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Evermeals</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="nav-bar">
        <img src="../photo/WhatsApp_Image_2025-12-19_at_2.27.11_PM-removebg-preview.png" alt="Evermeals Logo">
        <div class="nav-bar-icon">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="plan.html">Plan</a>
            <a href="#">AboutUs</a>
        </div>
        <div class="nav-bar-btn">
            <a href="login.html">Login</a>
            <a href="contact.html" id="btn2">Get in touch</a>
        </div>
    </div>

    <!-- Menu Section -->
    <div class="menu-container">
        <div class="menu-header">
            <h1>Our Weekly Menu</h1>
            <p>Explore our delicious meals for the week</p>
        </div>

        <!-- Veg/Non-Veg Toggle -->
        <div class="menu-toggle-section">
            <span class="toggle-label">Veg</span>
            <label class="toggle-switch">
                <input type="checkbox" id="vegToggle" checked>
                <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label">Non-Veg</span>
        </div>

        <!-- Week Days Selector -->
        <div class="week-days-selector">
            <button class="day-btn active" data-day="monday">Monday</button>
            <button class="day-btn" data-day="tuesday">Tuesday</button>
            <button class="day-btn" data-day="wednesday">Wednesday</button>
            <button class="day-btn" data-day="thursday">Thursday</button>
            <button class="day-btn" data-day="friday">Friday</button>
            <button class="day-btn" data-day="saturday">Saturday</button>
            <button class="day-btn" data-day="sunday">Sunday</button>
        </div>

        <!-- Menu Display Area -->
        <div class="menu-display">
            <div class="meal-section">
                <div class="meal-header">
                    <i class="fas fa-sun"></i>
                    <h2>Lunch</h2>
                </div>
                <div class="meal-items" id="lunchItems">
                    <!-- Lunch items will be populated here -->
                </div>
            </div>

            <div class="meal-section">
                <div class="meal-header">
                    <i class="fas fa-moon"></i>
                    <h2>Dinner</h2>
                </div>
                <div class="meal-items" id="dinnerItems">
                    <!-- Dinner items will be populated here -->
                </div>
            </div>
        </div>

        <!-- Subscribe Button -->
        <div class="subscribe-section">
            <a href="plan.html" class="subscribe-btn">Subscribe</a>
        </div>
    </div>

    <script src="menu.js"></script>
</body>
</html>
