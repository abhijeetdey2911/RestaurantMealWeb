<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Details - Evermeals</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="purchase.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="nav-bar">
        <img src="../photo/WhatsApp_Image_2025-12-19_at_2.27.11_PM-removebg-preview.png" alt="Evermeals Logo">
        <div class="nav-bar-icon">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="plan.html">Plan</a>
            <a href="#">AboutUs</a>
        </div>
        <div class="nav-bar-btn">
            <a href="login.html">Login</a>
            <a href="contact.html" id="btn2">Get in touch</a>
        </div>
    </div>

    <div class="purchase-container">
        <div class="purchase-header">
            <h1>Complete Your Purchase</h1>
            <p id="selected-plan">Plan: <span id="plan-name"></span> - ₹<span id="plan-price"></span></p>
        </div>

        <form id="purchase-form" class="purchase-form">
            <!-- Meal Type Selection -->
            <div class="form-section">
                <h2><i class="fas fa-leaf"></i> Meal Type</h2>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="mealType" value="veg" required>
                        <span class="radio-custom"></span>
                        <span class="radio-label">Vegetarian</span>
                        <i class="fas fa-leaf"></i>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="mealType" value="non-veg" required>
                        <span class="radio-custom"></span>
                        <span class="radio-label">Non-Vegetarian</span>
                        <i class="fas fa-drumstick-bite"></i>
                    </label>
                </div>
            </div>

            <!-- Meal Time Selection -->
            <div class="form-section">
                <h2><i class="fas fa-clock"></i> Meal Time</h2>
                <div class="checkbox-group">
                    <label class="checkbox-option">
                        <input type="checkbox" name="mealTime" value="lunch">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-label">Lunch</span>
                        <i class="fas fa-sun"></i>
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="mealTime" value="dinner">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-label">Dinner</span>
                        <i class="fas fa-moon"></i>
                    </label>
                </div>
            </div>

            <!-- Date Selection -->
            <div class="form-section">
                <h2><i class="fas fa-calendar-alt"></i> Select Dates</h2>
                <div class="date-group">
                    <div class="date-input">
                        <label for="start-date">Start Date</label>
                        <input type="date" id="start-date" name="startDate" required>
                    </div>
                    <div class="date-input">
                        <label for="end-date">End Date</label>
                        <input type="date" id="end-date" name="endDate" required>
                    </div>
                </div>
            </div>

            <!-- User Details -->
            <div class="form-section">
                <h2><i class="fas fa-user"></i> Your Details</h2>
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    <i class="fas fa-user input-icon"></i>
                </div>
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit phone number" maxlength="10" pattern="[0-9]{10}" required>
                    <i class="fas fa-phone input-icon"></i>
                </div>
                <div class="input-group address-group">
                    <div class="address-header">
                        <label for="address">Address</label>
                        <button type="button" id="select-from-map" class="btn-map">
                            <i class="fas fa-map-marked-alt"></i> Select from Map
                        </button>
                    </div>
                    <textarea id="address" name="address" placeholder="Enter your complete address or select from map" required></textarea>
                    <!-- <i class="fas fa-map-marker-alt input-icon"></i> -->
                </div>
            </div>

            <div class="form-actions">
                <button type="button" onclick="window.location.href='plan.html'" class="btn-cancel">Cancel</button>
                <button type="submit" class="btn-next">Next to Payment</button>
            </div>
        </form>
    </div>

    <!-- Map Modal -->
    <div id="map-modal" class="map-modal">
        <div class="map-modal-content">
            <div class="map-modal-header">
                <h3>Select Your Location on Map</h3>
                <button type="button" class="map-modal-close" id="close-map-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="map-container-wrapper">
                <div id="map" class="map-display"></div>
                <div class="map-controls">
                    <input type="text" id="map-search" placeholder="Search for location..." class="map-search-input">
                    <button type="button" id="confirm-location" class="btn-confirm-location">
                        <i class="fas fa-check"></i> Confirm Location
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Google Maps API - Replace YOUR_API_KEY with your actual Google Maps API key -->
    <!-- Get your API key from: https://console.cloud.google.com/google/maps-apis -->
    <!-- Required APIs: Maps JavaScript API, Places API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places" async defer></script>
    <script src="purchase.js"></script>
</body>
</html>
